# Render Blueprint: one free web service runs the API and serves the built React site.
# Render → New → Blueprint → pick this repository. You will be asked for the
# values marked "sync: false" (they are secrets and never stored in git).
services:
  - type: web
    name: abdull-store
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true # Render creates a long random secret
      - key: JWT_EXPIRE
        value: 30d
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string
      - key: STRIPE_SECRET_KEY
        sync: false # optional: sk_test_... to enable card payments
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # optional
